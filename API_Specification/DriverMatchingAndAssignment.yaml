openapi: 3.0.3
info:
  title: Driver Matching and Assignment API
  version: 1.0.0
  description: API tìm và phân công tài xế dựa trên vị trí, trạng thái sẵn sàng và
    tiêu chí vận hành. Tiêu chí ưu tiên cụ thể chưa được SRS chốt.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Driver Matching
  description: Tìm và phân công tài xế
paths:
  /driver-matching/search:
    post:
      tags:
      - Driver Matching
      summary: Tìm tài xế phù hợp
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
      responses:
        '200':
          description: Danh sách tài xế phù hợp
  /driver-matching/assign:
    post:
      tags:
      - Driver Matching
      summary: Gửi yêu cầu chuyến cho tài xế
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Gửi yêu cầu nhận chuyến thành công
components:
  schemas:
    MatchRequest:
      type: object
      required:
      - maYeuCau
      properties:
        maYeuCau:
          type: integer
    AssignRequest:
      type: object
      required:
      - maYeuCau
      - maTX
      properties:
        maYeuCau:
          type: integer
        maTX:
          type: integer
    DriverCandidate:
      type: object
      properties:
        maTX:
          type: integer
        hoTen:
          type: string
        khoangCach:
          type: number
        trangThaiHoatDong:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
