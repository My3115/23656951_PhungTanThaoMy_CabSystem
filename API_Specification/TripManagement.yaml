openapi: 3.0.3
info:
  title: Trip Management API
  version: 1.0.0
  description: API tiếp nhận chuyến, từ chối chuyến và cập nhật trạng thái trong quá
    trình thực hiện chuyến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Trip Management
  description: Quản lý chuyến
paths:
  /drivers/me/trip-requests:
    get:
      tags:
      - Trip Management
      summary: Xem các yêu cầu chuyến được đề xuất
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách yêu cầu chuyến
  /trips/{maChuyen}/accept:
    post:
      tags:
      - Trip Management
      summary: Tài xế nhận chuyến
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: maChuyen
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Nhận chuyến thành công
  /trips/{maChuyen}/reject:
    post:
      tags:
      - Trip Management
      summary: Tài xế từ chối chuyến
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: maChuyen
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Từ chối chuyến thành công
  /trips/{maChuyen}/status:
    patch:
      tags:
      - Trip Management
      summary: Cập nhật trạng thái chuyến
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: maChuyen
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
  /trips/{maChuyen}:
    get:
      tags:
      - Trip Management
      summary: Xem chi tiết chuyến
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: maChuyen
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Chi tiết chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
components:
  schemas:
    StatusUpdate:
      type: object
      required:
      - trangThai
      properties:
        trangThai:
          type: string
          enum:
          - DA_DEN_DIEM_DON
          - DA_DON_KHACH
          - DANG_DI_CHUYEN
          - HOAN_THANH
    RejectRequest:
      type: object
      properties:
        lyDo:
          type: string
    Trip:
      type: object
      properties:
        maChuyen:
          type: integer
        maKH:
          type: integer
        maTX:
          type: integer
        trangThai:
          type: string
        diemDon:
          type: string
        diemDen:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
