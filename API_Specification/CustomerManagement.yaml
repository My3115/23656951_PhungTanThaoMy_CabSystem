openapi: 3.0.3
info:
  title: Customer Management API
  version: 1.0.0
  description: API cho đăng ký, đăng nhập, quản lý thông tin và lịch sử khách hàng.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Customer Management
  description: Quản lý khách hàng và xác thực
paths:
  /auth/register:
    post:
      tags:
      - Customer Management
      summary: Đăng ký tài khoản khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
  /auth/login:
    post:
      tags:
      - Customer Management
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /customers/me:
    get:
      tags:
      - Customer Management
      summary: Xem thông tin cá nhân
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    put:
      tags:
      - Customer Management
      summary: Cập nhật thông tin cá nhân
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Cập nhật thành công
  /customers/me/trips:
    get:
      tags:
      - Customer Management
      summary: Xem lịch sử chuyến đi
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Danh sách lịch sử chuyến
components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - hoTen
      - soDienThoai
      - email
      - matKhau
      properties:
        hoTen:
          type: string
          example: Nguyen Van A
        soDienThoai:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: a@gmail.com
        matKhau:
          type: string
          format: password
          example: '********'
    LoginRequest:
      type: object
      required:
      - email
      - matKhau
      properties:
        email:
          type: string
          format: email
        matKhau:
          type: string
          format: password
    Customer:
      type: object
      properties:
        maKH:
          type: integer
          example: 1001
        hoTen:
          type: string
        soDienThoai:
          type: string
        email:
          type: string
          format: email
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/Customer'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
