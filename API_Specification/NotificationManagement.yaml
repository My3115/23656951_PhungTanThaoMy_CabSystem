openapi: 3.0.3
info:
  title: Notification Management API
  version: 1.0.0
  description: API quản lý thông báo về tiếp nhận yêu cầu, tài xế nhận chuyến, tài
    xế đến, hoàn thành chuyến và kết quả thanh toán.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Notification Management
  description: Quản lý thông báo
paths:
  /notifications:
    get:
      tags:
      - Notification Management
      summary: Xem danh sách thông báo
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /notifications/{id}/read:
    patch:
      tags:
      - Notification Management
      summary: Đánh dấu thông báo đã đọc
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Đánh dấu đã đọc thành công
components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
        loaiSuKien:
          type: string
        noiDung:
          type: string
        daDoc:
          type: boolean
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
