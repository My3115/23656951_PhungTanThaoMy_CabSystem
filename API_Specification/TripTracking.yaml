openapi: 3.0.3
info:
  title: Trip Tracking API
  version: 1.0.0
  description: API theo dõi trạng thái, thông tin tài xế, vị trí hiện tại và thời
    gian dự kiến tài xế đến.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Trip Tracking
  description: Theo dõi chuyến
paths:
  /trips/{maChuyen}/tracking:
    get:
      tags:
      - Trip Tracking
      summary: Theo dõi chuyến xe
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: maChuyen
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Trạng thái, thông tin tài xế, vị trí và thời gian dự kiến đến
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
