openapi: 3.0.3
info:
  title: BR03 - Quản lý chuyến đi
  version: 1.0.0
servers:
- url: https://api.example.com
tags:
- name: BR03
  description: Quản lý chuyến đi
paths:
  /api/trips/{tripId}/accept:
    post:
      tags:
      - BR03
      summary: Tài xế nhận chuyến
      description: 'BR03 - FR01: Tài xế nhận chuyến'
      responses:
        '200':
          description: Thành công
        '400':
          description: Yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực
        '500':
          description: Lỗi hệ thống
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/trips/{tripId}/status/arrived:
    patch:
      tags:
